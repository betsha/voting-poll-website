<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Voting Poll</title>
  <link rel="stylesheet" href="style.css">
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://llsbtmkwonzqzuimjpcy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsc2J0bWt3b256cXp1aW1qcGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0MTk2MjMsImV4cCI6MjA3ODk5NTYyM30.qdxSLEO5Erra9gsb_edgKDAHBjvOZlBsYtoZzsF3p18';
    const supabase = createClient(supabaseUrl, supabaseKey);

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('pollForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const votes = {};
        let allAnswered = true;

        ['q1','q2','q3','q4','q5','q6'].forEach(q => {
          const selected = document.querySelector(`input[name="${q}"]:checked`);
          if (!selected) allAnswered = false;
          else votes[q] = selected.value;
        });

        if (!allAnswered) {
          alert("Please answer all questions!");
          return;
        }

        // Save votes to Supabase
        for (const [question, option] of Object.entries(votes)) {
          const { data: existing } = await supabase
            .from('votes')
            .select('*')
            .eq('question', question)
            .eq('option', option)
            .single();

          if (existing) {
            await supabase
              .from('votes')
              .update({ count: existing.count + 1 })
              .eq('question', question)
              .eq('option', option);
          } else {
            await supabase
              .from('votes')
              .insert({ question: question, option: option, count: 1 });
          }
        }

        window.location.href = 'result.html';
      });
    });
  </script>
</head>
<body>
  <div class="container">
    <h1>💡 Tech Voting Poll</h1>
    <form id="pollForm">

      <div class="poll">
        <p>1. Favorite programming language?</p>
        <label><input type="radio" name="q1" value="Python"><span class="circle"></span> Python</label>
        <label><input type="radio" name="q1" value="JavaScript"><span class="circle"></span> JavaScript</label>
        <label><input type="radio" name="q1" value="Java"><span class="circle"></span> Java</label>
      </div>

      <div class="poll">
        <p>2. Preferred IDE?</p>
        <label><input type="radio" name="q2" value="VS Code"><span class="circle"></span> VS Code</label>
        <label><input type="radio" name="q2" value="PyCharm"><span class="circle"></span> PyCharm</label>
        <label><input type="radio" name="q2" value="IntelliJ"><span class="circle"></span> IntelliJ</label>
      </div>

      <div class="poll">
        <p>3. Favorite tech company?</p>
        <label><input type="radio" name="q3" value="Google"><span class="circle"></span> Google</label>
        <label><input type="radio" name="q3" value="Microsoft"><span class="circle"></span> Microsoft</label>
        <label><input type="radio" name="q3" value="Apple"><span class="circle"></span> Apple</label>
      </div>

      <div class="poll">
        <p>4. Preferred mobile OS?</p>
        <label><input type="radio" name="q4" value="Android"><span class="circle"></span> Android</label>
        <label><input type="radio" name="q4" value="iOS"><span class="circle"></span> iOS</label>
        <label><input type="radio" name="q4" value="Others"><span class="circle"></span> Others</label>
      </div>

      <div class="poll">
        <p>5. Favorite cloud platform?</p>
        <label><input type="radio" name="q5" value="AWS"><span class="circle"></span> AWS</label>
        <label><input type="radio" name="q5" value="Azure"><span class="circle"></span> Azure</label>
        <label><input type="radio" name="q5" value="Google Cloud"><span class="circle"></span> Google Cloud</label>
      </div>

      <div class="poll">
        <p>6. Preferred front-end framework?</p>
        <label><input type="radio" name="q6" value="React"><span class="circle"></span> React</label>
        <label><input type="radio" name="q6" value="Vue"><span class="circle"></span> Vue</label>
        <label><input type="radio" name="q6" value="Angular"><span class="circle"></span> Angular</label>
      </div>

      <button type="submit">Submit Votes</button>
    </form>
  </div>
</body>
</html>
